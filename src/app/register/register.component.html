<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
    integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous" />

<section id="register">
    <div class="min-h-screen flex flex-col items-center justify-center bg-gray-100">
        <div class="flex flex-col bg-white shadow-md px-4 sm:px-6 md:px-8 lg:px-10 py-8 rounded-3xl w-50 max-w-md">
            <div class="font-medium self-center text-xl sm:text-3xl text-gray-800">Registrarse</div>
            <div class="mt-4 self-center text-xl sm:text-sm text-gray-800">Ingresa tus credenciales para crear una cuenta</div>
            <div class="mt-10">
                <form [formGroup]="registerForm" (ngSubmit)="register()">
                    
                    <!-- Mensaje de error general -->
                    <div *ngIf="errorMessage" class="mb-4 text-red-500 text-sm text-center">
                        {{ errorMessage }}
                    </div>

                    <div class="flex flex-col mb-5">
                        <label for="username" class="mb-1 text-xs tracking-wide text-gray-600">Nombre:</label>
                        <div class="relative">
                            <div class="inline-flex items-center justify-center absolute left-0 top-0 h-full w-10 text-gray-400">
                                <i class="fas fa-user text-blue-500"></i>
                            </div>
                            <input id="username" type="text" name="username" formControlName="username"
                                class="text-sm placeholder-gray-500 pl-10 pr-4 rounded-2xl border border-gray-400 w-full py-2 focus:outline-none focus:border-blue-400"
                                placeholder="Ingresa tu nombre" />
                        </div>
                    </div>

                    <div class="flex flex-col mb-5">
                        <label for="email" class="mb-1 text-xs tracking-wide text-gray-600">Email:</label>
                        <div class="relative">
                            <div class="inline-flex items-center justify-center absolute left-0 top-0 h-full w-10 text-gray-400">
                                <i class="fas fa-at text-blue-500"></i>
                            </div>
                            <input id="email" type="email" name="email" formControlName="email"
                                class="text-sm placeholder-gray-500 pl-10 pr-4 rounded-2xl border border-gray-400 w-full py-2 focus:outline-none focus:border-blue-400"
                                placeholder="Ingresa tu email" />
                        </div>
                    </div>

                    <div class="flex flex-col mb-6">
                        <label for="password" class="mb-1 text-xs tracking-wide text-gray-600">Contraseña:</label>
                        <div class="relative">
                            <div class="inline-flex items-center justify-center absolute left-0 top-0 h-full w-10 text-gray-400">
                                <i class="fas fa-lock text-blue-500"></i>
                            </div>
                            <input id="password" type="password" name="password" formControlName="password"
                                class="text-sm placeholder-gray-500 pl-10 pr-4 rounded-2xl border border-gray-400 w-full py-2 focus:outline-none focus:border-blue-400"
                                placeholder="Ingresa tu contraseña" />
                        </div>
                    </div>

                    <div class="flex w-full cursor-pointer">
                        <button type="submit"
                            class="flex mt-2 items-center justify-center focus:outline-none text-white text-sm sm:text-base bg-blue-500 hover:bg-blue-600 rounded-2xl py-2 w-full transition duration-150 ease-in">
                            <span class="mr-2 uppercase">Registrarse</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="flex justify-center items-center mt-6">
            <a href="#" target="_blank" class="inline-flex items-center text-gray-700 font-medium text-xs text-center">
                <span class="ml-2">¿Ya tienes una cuenta? <a href="#" class="text-xs ml-2 text-blue-500 font-semibold"
                        (click)="logIn()">Inicia sesión aquí</a></span>
            </a>
        </div>
    </div>
</section>
